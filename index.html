<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - Vue</title>
    <link rel="stylesheet" href="">
</head>

<body>

    <div id="app">
        <div :style="styles">
            <label for="themeBlack">
                <input type="checkbox" :checked="themeBlack" @click="toggleTheme" name="themeBlack" id="themeBlack"> Tema Escuro
            </label>
            <h1>{{ title }}</h1>

            <p>{{ fullName }}</p>

            <hr>

            <h3>Carrinho ({{ cart.length }})</h3>

            <ul>
                <li v-for="(product, index) in products" :key="product.title">
                    <p>{{ product.title }}</p>

                    <img :src="product.image" :alt="product.description" height="300">

                    <p v-if="product.stars > 0">
                        <strong>{{ product.stars }}</strong>
                    </p>
                    <!-- <a href="#" @click.prevent="removeCart(product)" v-if="inCart(product)">
                        Remover do Carrinho
                    </a> -->

                    <button v-on:click.prevent="addCart(product)" :disabled="inCart(product)">
                        Adcionar no Carrinho
                    </a>

                </button>
            </ul>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js"></script>
</body>

</html>
